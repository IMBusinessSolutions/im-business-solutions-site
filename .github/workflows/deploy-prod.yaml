# =========================================================
# CI & Déploiement — IM Business Solutions
#
# Dépôt fusionné : l'application Symfony (racine du dépôt — src/,
# templates/, vendor/ généré à la volée, etc.) et le site vitrine PHP/HTML
# historique (dans public/, aux côtés des fichiers publics de Symfony).
# Les deux cohabitent déjà dans le même document racine sur l'hébergement
# OVH (compte FTP imbusim) : le déploiement copie donc tout le dépôt (à
# l'exception des dossiers de dev) vers la racine de ce compte.
#
# Hébergement mutualisé, sans étape de build côté serveur : `composer
# install` tourne ici, dans la CI, et le résultat (vendor/) est envoyé tel
# quel. Les assets Symfony compilés (public/build/, public/assets/…) sont
# directement commités dans le dépôt — pas de `npm run build` en CI.
#
# Secrets GitHub à configurer avant le premier déploiement
# (Settings → Secrets and variables → Actions) :
#   FTP_SERVER      ex. ftp.cluster121.hosting.ovh.net
#   FTP_USERNAME    ex. imbusim
#   FTP_PASSWORD
#   FTP_SERVER_DIR  dossier cible côté hébergeur ("." = racine du compte)
#
# ATTENTION : à ce jour, les runners GitHub Actions (IP Azure) ne
# parviennent pas à joindre le port SSH/SFTP de cet hébergement OVH
# (timeout réseau, cause probable : filtrage des IP de datacenters cloud
# côté OVH). Ce workflow échoue donc à l'étape de déploiement tant que ce
# blocage réseau n'est pas levé (contact support OVH, ou runner
# auto-hébergé sur une machine que l'hébergeur laisse passer) — le
# déploiement se fait alors manuellement (SFTP direct depuis une machine
# qui, elle, est autorisée).
# =========================================================

name: CI & Déploiement

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  ci:
    name: Vérifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, fileinfo, intl
          coverage: none

      - name: Vérifier la syntaxe de tous les fichiers PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "-- $file"
            php -l "$file" || status=1
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*" -print0)
          exit $status

      - name: Vérifier qu'aucun identifiant réel n'est commité
        run: |
          if [ -f public/includes/config.php ]; then
            echo "::error::public/includes/config.php ne doit jamais être commité (il contient les identifiants de la base de données)."
            exit 1
          fi
          if [ -f .env.local.php ] || [ -f .env.local ]; then
            echo "::error::.env.local(.php) ne doit jamais être commité (il contient les secrets Symfony de prod)."
            exit 1
          fi

  deploy-prod:
    name: Déploiement production (SFTP)
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout du tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier que le tag est issu de main
        id: check
        run: |
          git fetch origin main --quiet
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "Tag non issu de main, déploiement prod ignoré."
          fi

      - name: Setup PHP + Composer
        if: steps.check.outputs.on_main == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, fileinfo, intl
          tools: composer
          coverage: none

      - name: Installer les dépendances PHP (vendor/, non commité)
        if: steps.check.outputs.on_main == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      # =========================
      # PREPARER LES FICHIERS A DEPLOYER
      #
      # public/includes/config.php, .env.local(.php) et le contenu
      # généré en prod (uploads, images de réalisations PHP) ne sont de
      # toute façon pas versionnés (voir .gitignore) : cette liste est une
      # protection supplémentaire pour qu'ils ne soient jamais touchés par
      # le déploiement, même en cas d'erreur de configuration.
      # =========================

      - name: Préparer le dossier à déployer
        if: steps.check.outputs.on_main == 'true'
        run: |
          mkdir -p /tmp/deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='.github' \
            --exclude='.github/**' \
            --exclude='sql' \
            --exclude='sql/**' \
            --exclude='tests' \
            --exclude='tests/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='var/cache' \
            --exclude='var/cache/**' \
            --exclude='var/log' \
            --exclude='var/log/**' \
            --exclude='.env.local' \
            --exclude='.env.local.php' \
            --exclude='public/includes/config.php' \
            --exclude='public/uploads/*' \
            --exclude='public/assets/images/projets/*' \
            ./ /tmp/deploy/

      - name: Déployer par SFTP
        if: steps.check.outputs.on_main == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: /tmp/deploy/*
          remote_path: ${{ secrets.FTP_SERVER_DIR }}
